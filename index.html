async function fetchAll(t){let out=[],off=0;for(;;){const r=await sbReq(t.t+'?select=*&order='+t.pk.join(',')+'&limit=1000&offset='+off);out=out.concat(r||[]);if(!r||r.length<1000)break;off+=1000}return out}
const qt=v=>'"'+String(v).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
async function delRows(t,items){if(t.pk.length==1){for(let i=0;i<items.length;i+=100){const vals=items.slice(i,i+100).map(([k,js])=>qt(JSON.parse(js)[t.pk[0]]));await sbReq(t.t+'?'+t.pk[0]+'=in.('+encodeURIComponent(vals.join(','))+')',{method:'DELETE',headers:{Prefer:'return=minimal'}})}}else for(const [k,js] of items){const o=JSON.parse(js);await sbReq(t.t+'?'+t.pk.map(c=>c+'=eq.'+encodeURIComponent(o[c])).join('&'),{method:'DELETE',headers:{Prefer:'return=minimal'}})}}
async function upRows(t,items){for(let i=0;i<items.length;i+=60){const ch=items.slice(i,i+60);await sbReq(t.t+'?on_conflict='+t.pk.join(','),{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:'['+ch.map(x=>x[1]).join(',')+']'});ch.forEach(([k,js])=>LASTM[t.t].set(k,js))}}

/* ---- tải / lưu ---- */
function applyUI(){P='dash';Q='';T='';TC='';ED=null;CD=null;OV=null;OF=false;PF=false;ANIM=true;render()}
async function cloudLoad(){const m=await sbReq('app_meta?id=eq.main&select=rev');
if(!m||!m.length){const r=await sbReq('app_meta',{method:'POST',headers:{Prefer:'return=representation'},body:'{"id":"main","rev":1}'});REV=r[0].rev;LASTM={};TB.forEach(t=>LASTM[t.t]=new Map());LASTJ=''}
else{REV=m[0].rev;const data=await Promise.all(TB.map(fetchAll));const base=JSON.parse(JSON.stringify(S0));base.n.row=0;S=base;TB.forEach((t,i)=>t.set(S,data[i]));LASTM=snap();LASTJ=JSON.stringify(S);applyUI()}
READY=true;CONFLICT=false;FAILS=0;$('#lg').classList.add('off');setSync('☁️ Đã lưu '+hh())}
async function cloudSave(){if(!READY||SAVING||CONFLICT)return;stamp();const j=JSON.stringify(S);if(j===LASTJ)return;SAVING=true;setSync('⏳ Đang lưu…');
try{const cur=snap(),plan=TB.map(t=>{const L=LASTM[t.t]||(LASTM[t.t]=new Map()),C=cur[t.t],up=[],del=[];C.forEach((js,k)=>{if(L.get(k)!==js)up.push([k,js])});L.forEach((js,k)=>{if(!C.has(k))del.push([k,js])});return{t,up,del}});
if(plan.some(p=>p.up.length||p.del.length)){const b=await sbReq('app_meta?id=eq.main&rev=eq.'+REV,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({rev:REV+1,updated_at:new Date().toISOString()})});
if(!b||!b.length){CONFLICT=true;setSync('⚠️ Dữ liệu đã đổi ở nơi khác',true);conflictBox();return}REV+=1;
for(const p of plan.slice().reverse())if(p.del.length){await delRows(p.t,p.del);p.del.forEach(([k])=>LASTM[p.t.t].delete(k))}
for(const p of plan)if(p.up.length)await upRows(p.t,p.up)}
LASTJ=j;FAILS=0;setSync('☁️ Đã lưu '+hh())}
catch(e){FAILS++;setSync('⚠️ Lỗi lưu: '+e.message+' (tự thử lại)',true)}finally{SAVING=false}}
function conflictBox(){if($('#cf'))return;const d=document.createElement('div');d.id='cf';d.style.cssText='position:fixed;inset:0;z-index:9998;background:#0006;display:flex;align-items:center;justify-content:center';d.innerHTML='<div class="panel" style="width:min(420px,92vw)"><h2>⚠️ Dữ liệu đã được cập nhật ở thiết bị khác</h2><p class="muted">Để tránh ghi đè mất dữ liệu, web tạm dừng lưu. Bấm tải lại để lấy bản mới nhất (các thay đổi chưa lưu trên máy này sẽ mất).</p><button class="btn primary" id="cf_b">Tải lại dữ liệu mới nhất</button></div>';document.body.appendChild(d);$('#cf_b').onclick=async()=>{try{await cloudLoad();d.remove()}catch(e){setSync('⚠️ '+e.message,true)}}}
async function cloudPoll(){if(!READY||SAVING||CONFLICT)return;try{const r=await sbReq('app_meta?id=eq.main&select=rev');if(!r||!r.length||r[0].rev<=REV)return;stamp();if(JSON.stringify(S)!==LASTJ){CONFLICT=true;setSync('⚠️ Dữ liệu đã đổi ở nơi khác',true);conflictBox()}else if(!ED&&!OF&&!PF&&!CD)await cloudLoad()}catch(e){}}
function showLg(msg){$('#lg').classList.remove('off');const m=$('#lg_m');m.style.display=msg?'block':'none';m.textContent=msg||'';$('#lg_b').disabled=false;$('#lg_b').textContent='Đăng nhập'}
async function cloudInit(){const a=lsGet();if(a){AUTH=a;try{await tok();await cloudLoad();return}catch(e){if(/Failed to fetch|NetworkError|Load failed/i.test(e.message)){showLg('Không kết nối được máy chủ. Kiểm tra mạng rồi tải lại trang.');return}if(/bảng|schema/.test(e.message)){showLg(e.message);return}AUTH=null;lsSet(null);showLg('')}}else showLg('')}
$('#lgf').addEventListener('submit',async e=>{e.preventDefault();const b=$('#lg_b');b.disabled=true;b.textContent='Đang đăng nhập…';try{await sbAuth('password',{email:$('#lg_e').value.trim(),password:$('#lg_p').value});await cloudLoad()}catch(er){showLg(/Failed to fetch|NetworkError|Load failed/i.test(er.message)?'Không kết nối được máy chủ.':er.message=='Invalid login credentials'?'Sai email hoặc mật khẩu.':er.message)}});
$('#lgo').addEventListener('click',e=>{e.preventDefault();lsSet(null);READY=false;location.reload()});
setInterval(cloudSave,SB.save);setInterval(cloudPoll,SB.poll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)cloudSave()});
cloudInit();
</script>

<script>
(function(){const r=document.documentElement,b=document.getElementById('thm');const sync=()=>{b.textContent=r.dataset.theme=='dark'?'☀️':'🌙';b.title=r.dataset.theme=='dark'?'Chuyển sang giao diện sáng':'Chuyển sang giao diện tối'};sync();b.addEventListener('click',()=>{const t=r.dataset.theme=='dark'?'light':'dark';r.dataset.theme=t;try{localStorage.setItem('bg_theme',t)}catch(e){}sync()})})();
</script>
